name: Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate embedded JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          const scripts=html.split('<script').slice(1).map(chunk=>{
            const gt=chunk.indexOf('>');
            const close=chunk.indexOf('</script>');
            return gt>=0&&close>gt?chunk.slice(gt+1,close):'';
          }).filter(src=>src.trim());
          scripts.forEach((src,i)=>new vm.Script(src,{filename:'inline-'+(i+1)+'.js'}));
          console.log('Validated '+scripts.length+' inline scripts');
          NODE

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-singularity-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
