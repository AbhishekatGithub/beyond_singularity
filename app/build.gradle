plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nullstatestudios.beyondsingularity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nullstatestudios.beyondsingularity'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.10.0-alpha'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
